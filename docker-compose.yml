services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - 5678:5678
    command: |
      bash -c "
      python -m debugpy --listen 0.0.0.0:5678 -m uvicorn main:app --reload --host 0.0.0.0 --port 8000
      "
    restart: unless-stopped
    volumes:
      - ./app:/app
